# Pre-commit hooks configuration
# Install with: pip install pre-commit && pre-commit install
# Run manually with: pre-commit run --all-files

repos:
  # General file checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
        name: Trim trailing whitespace
      - id: end-of-file-fixer
        name: Fix end of file
      - id: check-yaml
        name: Check YAML
        args: ['--unsafe']
      - id: check-json
        name: Check JSON
      - id: check-merge-conflict
        name: Check for merge conflicts
      - id: check-case-conflict
        name: Check for case conflicts
      - id: debug-statements
        name: Check for debugger imports
      - id: detect-private-key
        name: Detect private keys

  # Python code formatting with Black
  - repo: https://github.com/psf/black
    rev: 24.1.1
    hooks:
      - id: black
        name: Format with Black
        language_version: python3.10
        args: ['--line-length=100']

  # Import sorting with isort
  - repo: https://github.com/PyCQA/isort
    rev: 5.13.2
    hooks:
      - id: isort
        name: Sort imports with isort
        args: ['--profile', 'black', '--line-length', '100']

  # Python linting with Ruff
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.1.11
    hooks:
      - id: ruff
        name: Lint with Ruff
        args: ['--fix']

  # Docstring checks
  - repo: https://github.com/PyCQA/pydocstyle
    rev: 6.3.0
    hooks:
      - id: pydocstyle
        name: Check docstrings
        args: ['--convention=google']
        exclude: '^(test_|_test\.py|tests\.py)'

  # Type checking with mypy
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.8.0
    hooks:
      - id: mypy
        name: Type check with mypy
        args: ['--ignore-missing-imports', '--no-strict-optional']
        additional_dependencies: ['types-all']
        exclude: '^(test_|_test\.py|tests\.py|training/|infra/)'

  # YAML linting
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.33.0
    hooks:
      - id: yamllint
        name: Lint YAML
        args: ['-c', '{extends: default, rules: {line-length: {max: 120}}}']

  # Dockerfile linting (optional)
  - repo: https://github.com/hadialqattan/hadolint-py
    rev: v2.1.1
    hooks:
      - id: hadolint-docker
        name: Lint Dockerfiles
        exclude: '^(infra/storage/minio/Dockerfile|infra/tracking/mlflow/Dockerfile)'

# Configuration options
default_language_version:
  python: python3.10

# Files to exclude
exclude: |
  (?x)^(
    venv/|
    __pycache__/|
    \.venv/|
    env/|
    data/|
    node_modules/|
    \.git/|
    build/|
    dist/|
    \.eggs/
  )

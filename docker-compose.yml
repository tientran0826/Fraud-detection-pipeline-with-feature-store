version: '3.8'
services:
  redis:
    image: redis:7.0-alpine
    ports:
      - "6379:6379"
    
  jobmanager:
    build: 
      context: .
      dockerfile: ./infra/compute/flink/Dockerfile
    ports:
      - "8081:8081"
    command: jobmanager
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: jobmanager
    volumes:
      - .:/opt/flink/usrlib

  taskmanager:
    build: 
      context: .
      dockerfile: ./infra/compute/flink/Dockerfile
    depends_on:
      - jobmanager
    command: taskmanager
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: jobmanager
        taskmanager.numberOfTaskSlots: 2
        taskmanager.memory.process.size: 4096m
        taskmanager.memory.framework.off-heap.size: 256m
        taskmanager.memory.task.off-heap.size: 512m
    volumes:
      - .:/opt/flink/usrlib

  serving-api:
    build:
      context: .
      dockerfile: ./serving/Dockerfile
    ports:
      - "8000:8000"
    depends_on:
      - redis
    volumes:
      - .:/app

  minio:
    build:
      context: .
      dockerfile: ./infra/storage/minio/Dockerfile
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio_data:/data

  mlflow:
    build:
      context: .
      dockerfile: ./infra/tracking/mlflow/Dockerfile
    ports:
      - "5000:5000"
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - MLFLOW_S3_ENDPOINT_URL=http://minio:9000
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-minioadmin}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-minioadmin}
    depends_on:
      - minio

volumes:
  minio_data: